			<h1>利用規約</h1>
			<section>
				<h2>サービスの利用</h2>
				<p>本サービスは、利用者同士が音声・映像・チャットで会話するためのサービスです。利用者は自己の責任で本サービスを利用するものとします。</p>
			</section>
			<section>
				<h2>禁止事項</h2>
				<p>他者への嫌がらせ、個人情報の不正な収集・公開、違法行為、公序良俗に反する行為、サービス運営を妨げる行為を禁止します。</p>
			</section>
			<section>
				<h2>通話と通信</h2>
				<p>通話にはカメラとマイクへのアクセスが必要です。通信環境や端末の状態により、通話品質が低下または接続できない場合があります。</p>
			</section>
			<section>
				<h2>免責事項</h2>
				<p>利用者間のやりとりにより生じた損害やトラブルについて、運営者は責任を負いません。</p>
			</section>
